roles:
  - role: "Оркестратор"
    model: "Fable 5.2 или Opus 5.5, основная сессия смены"
    task: "План, задания, приёмка, коммиты, учёт, журнал, передача смены"
  - role: "Исследователь (researcher)"
    model: "Sonnet 5.5 / high"
    task: "Ресерч со ссылкой и датой у каждого вывода"
  - role: "Дизайнер (designer)"
    model: "Sonnet 5.5 / high; ключевые экраны — Opus 5.5"
    task: "Дизайн-система, экраны, состояния"
  - role: "Разработчик (builder)"
    model: "Sonnet 5.5 / high; рутина — medium"
    task: "Функция по заданию вместе с тестами"
  - role: "Ревьюер (reviewer)"
    model: "Sonnet 5.5 / high"
    task: "Ревью кода и документов со свежим контекстом"
  - role: "Аудитор безопасности (security-auditor)"
    model: "Opus 5.5 / high"
    task: "Независимая проверка защиты, атакующие тесты"
  - role: "Проверка на телефоне (mobile-qa)"
    model: "Sonnet 5.5 / medium"
    task: "Сценарии на 360 px, снимки, доступность, скорость"
  - role: "«Жюри» (jury)"
    model: "Opus 5.5 / high; финал — xhigh"
    task: "Баллы по четырём критериям и чего не хватает до 10"
  - role: "Ревьюер промптов (prompt-reviewer)"
    model: "Sonnet 5.5 / high"
    task: "CLAUDE.md, роли, задания: ясность и полнота"
  - role: "Проверка фактов (fact-checker)"
    model: "Sonnet 5.5 / high"
    task: "Сверка описания процесса с журналом, git и реестром промптов"
  - role: "Исполнитель прогонов (runner)"
    model: "Haiku 5.5 / low"
    task: "Тесты, сборка, линтер, сводка логов"

